[build]
  publish = "public"
  command = "node scripts/make-config.js"

[build.environment]
  NODE_VERSION = "20"

# 게임 본문은 자주 바뀌므로 캐시하지 않고, 그림·글꼴은 오래 캐시한다
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
